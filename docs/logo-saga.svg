<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 110" width="430" height="110" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- SAGA · marca del sistema.
       Un marco de puerta visto de frente: dos jambas y un dintel. La jamba
       derecha está interrumpida y en el hueco hay un punto: es el paso que
       se evalúa antes de otorgarlo, que es lo que hace el motor de reglas.
       El vano queda vacío a propósito: lo que define un acceso es el hueco,
       no la cerradura. -->
  <g fill="none" stroke="#2F5D50" stroke-width="7" stroke-linecap="butt">
    <path d="M21 98 L21 24 L79 24 L79 48"/>
    <path d="M79 74 L79 98"/>
  </g>
  <circle cx="79" cy="61" r="7.5" fill="#C86B4A"/>

  <text x="112" y="66"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="44" font-weight="bold" letter-spacing="4"
        fill="#1D1D1B">SAGA</text>
  <text x="114" y="89"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" letter-spacing="0.4"
        fill="#5A5A58">Sistema de Análisis y Gestión de Accesos</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
