[mypy]
python_version = 3.12
files = app, herramientas
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True

; Las librerias de terceros que no publican tipos no deberian frenar la
; verificacion del codigo propio.
[mypy-faker.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True
